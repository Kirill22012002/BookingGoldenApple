# PostgreSQL for BGA.API — matches ConnectionStrings:DefaultConnection in appsettings.json
# Start from the repository root: docker compose up -d
# Stop: docker compose down
# Data is stored in the named volume bgaapi_pgdata

services:
  postgres:
    image: postgres:16-alpine
    container_name: bgaapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bgaapi
    ports:
      - "5432:5432"
    volumes:
      - bgaapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bgaapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bgaapi_pgdata:
