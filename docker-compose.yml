services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: bga-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - bga-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bga-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 30"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - bga-network

  redis:
    image: redis:7.2-alpine
    container_name: bga-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bga-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: bga-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - bga-network

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: bga-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - bga-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: bga-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - bga-network

  users-db:
    image: postgres:16-alpine
    container_name: bga-users-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bga_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bga_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bga-network

  events-db:
    image: postgres:16-alpine
    container_name: bga-events-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bga_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bga_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bga-network

  bookings-db:
    image: postgres:16-alpine
    container_name: bga-bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bga_bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bga_bookings"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bga-network

  users-api:
    build:
      context: .
      dockerfile: src/BGA.Users/BGA.Users.API/Dockerfile
    container_name: bga-users-api
    restart: unless-stopped
    depends_on:
      users-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=users-db;Port=5432;Database=bga_users;Username=postgres;Password=postgres
      Otlp__Endpoint: http://jaeger:4317
    ports:
      - "56514:8080"
    networks:
      - bga-network

  events-api:
    build:
      context: .
      dockerfile: src/BGA.Events/BGA.Events.API/Dockerfile
    container_name: bga-events-api
    restart: unless-stopped
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=events-db;Port=5432;Database=bga_events;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      Redis__ConnectionString: redis:6379
      Otlp__Endpoint: http://jaeger:4317
    ports:
      - "56515:8080"
    networks:
      - bga-network

  bookings-api:
    build:
      context: .
      dockerfile: src/BGA.Bookings/BGA.Bookings.API/Dockerfile
    container_name: bga-bookings-api
    restart: unless-stopped
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=bookings-db;Port=5432;Database=bga_bookings;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      Otlp__Endpoint: http://jaeger:4317
    ports:
      - "56516:8080"
    networks:
      - bga-network

networks:
  bga-network:
    driver: bridge

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
  grafana-data:
